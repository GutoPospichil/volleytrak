<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>{% block title %}VolleyTrak{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">VT</span><span>VolleyTrak</span></a>
    <nav class="nav">
      <a href="/">Partidas</a>
      <a href="/players">Jogadores</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Processamento local · sem serviços pagos</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
