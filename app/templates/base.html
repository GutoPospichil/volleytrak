<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <meta name="application-name" content="VolleyTrak">
  <meta name="apple-mobile-web-app-title" content="VolleyTrak">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}VolleyTrak{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/ui.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img class="brand-logo" src="/static/brand/volleytrack-mark-transparent.png" alt="VolleyTrak"><span>VolleyTrak</span></a>
    <div class="topbar-right">
      <nav class="nav">
        <a href="/">Partidas</a>
        <a href="/clipes">Clipes salvos</a>
        <a href="/aprendizado">Aprendizado</a>
        <a href="/players">Jogadores</a>
        <a href="/configuracoes">Configurações</a>
      </nav>
      <button id="mute-toggle" class="button ghost small mute-toggle" type="button" aria-pressed="false" title="Mutar vídeos (M)">
        <span class="mute-icon">&#128266;</span><span class="mute-label">Som</span>
      </button>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Processamento local · sem serviços pagos</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
